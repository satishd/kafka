# Sample configuration for the segment-lake converter worker (org.apache.kafka.lake.ConverterWorker).
# See README.md for a description of each stage this config enables.

# --- Discovery: read __remote_log_metadata ---
bootstrap.servers=localhost:9092
remote.log.metadata.topic.name=__remote_log_metadata
group.id=segment-lake-ingestion
topics.allowlist=orders

# --- Fetch: load the configured RemoteStorageManager (reuse the broker's values) ---
remote.storage.manager.class.name=org.apache.kafka.hdfs.remote.HdfsRemoteStorageManager
#remote.storage.manager.class.path=
rsm.config.hdfs.uri=hdfs://namenode:8020
rsm.config.hdfs.base.dir=/kafka/tiered-storage

# --- Decode: Heatpipe header parse + Avro decode against the Schema Service ---
schema.client.class.name=com.uber.kafka.lake.schema.SchemaServiceClient
schema.client.config.schema.service.url=http://schema-service.uber.internal:8080

# --- Write: Hudi table on OCS ---
hudi.table.base.path=cfs://ns-cloudlake/segment-lake-ingestion/orders
hudi.table.name=orders_table
hudi.record.key.field=id
hudi.partition.path.field=order_date

# --- Ops ---
deadletter.path=/var/log/segment-lake-ingestion/dead-letters.tsv
max.concurrent.segments=4
# Block size (bytes) for streaming a segment from remote storage. Segments are read and parsed one
# record batch at a time, so peak memory per in-flight segment is bounded by this plus the largest
# batch. Larger blocks mean fewer reads against the object store. Default 4 MiB.
read.block.bytes=4194304
