# Sample configuration for the segment-lake converter worker (org.apache.kafka.lake.ConverterWorker).
# See README.md for a description of each stage this config enables.

# --- Discovery: read __remote_log_metadata ---
bootstrap.servers=localhost:9092
remote.log.metadata.topic.name=__remote_log_metadata
group.id=segment-lake-ingestion
topics.allowlist=orders

# --- Fetch: load the configured RemoteStorageManager (reuse the broker's values) ---
remote.storage.manager.class.name=org.apache.kafka.hdfs.remote.HdfsRemoteStorageManager
#remote.storage.manager.class.path=
rsm.config.hdfs.uri=hdfs://namenode:8020
rsm.config.hdfs.base.dir=/kafka/tiered-storage

# --- Decode: Heatpipe header parse + Avro decode against the Schema Service ---
schema.client.class.name=com.uber.kafka.lake.schema.SchemaServiceClient
schema.client.config.schema.service.url=http://schema-service.uber.internal:8080

# --- Write: Hudi table on OCS ---
hudi.table.base.path=cfs://ns-cloudlake/segment-lake-ingestion/orders
hudi.table.name=orders_table
hudi.record.key.field=id
hudi.partition.path.field=order_date

# --- Ops ---
deadletter.path=/var/log/segment-lake-ingestion/dead-letters.tsv
# Segments are fetched and Avro-decoded concurrently up to this many at a time. Writing to Hudi is
# always done by a single commit thread (HoodieJavaWriteClient is single-writer), so this does not
# increase write parallelism.
max.concurrent.segments=4
# Bounded hand-off queue between the concurrent decode stage and the single Hudi commit thread.
# Together with max.concurrent.segments this bounds how many decoded segments are held in memory.
write.queue.capacity=8
# Retries (with backoff) for a failed Hudi write before a segment is marked failed. A failed segment
# is never silently dropped: its metadata-topic offset is left uncommitted so a restart re-processes
# it idempotently (via the Hudi commit timeline).
write.max.retries=3
write.retry.backoff.ms=1000
# How often the worker tries to commit the metadata-topic offset. A commit only happens at a
# quiescent checkpoint (nothing in flight, none failed, none half-assembled), so the committed
# position is always safe to resume from. (enable.auto.commit is forced off by the worker.)
offset.commit.interval.ms=5000
# Block size (bytes) for reading a segment from remote storage. Segments are read and parsed one
# record batch at a time, so peak memory per in-flight segment is bounded by this plus the largest
# batch. In cache mode this is also the download transfer-buffer size. Default 4 MiB.
read.block.bytes=4194304
# How segments are read: 'stream' reads the remote object directly (no local disk); 'cache'
# prefetches the whole segment to a local file and reads batches from it, freeing the network
# stream sooner at the cost of local disk. Default 'stream'.
read.mode=stream
# Directory for prefetched segment files when read.mode=cache. Defaults to the JVM temp dir. Needs
# room for (largest segment size) x max.concurrent.segments.
#read.cache.dir=/var/cache/segment-lake-ingestion
